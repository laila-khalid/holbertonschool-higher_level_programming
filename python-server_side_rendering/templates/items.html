<!doctype html>
<html lang="en">
<head>
    <title>Items List</title>
</head>
<body>
    <header>
        <h1>My Flask App</h1>
    </header>

    <h1>Items List</h1>
    
    {% if items %}
        <ul>
            {% for item in items %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No items found</p>
    {% endif %}

    <footer>
        <p>&copy; 2024 My Flask App</p>
    </footer>
</body>
</html>
