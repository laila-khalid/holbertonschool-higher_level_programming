<!doctype html>
<html lang="en">
<head>
    <title>Products</title>
</head>
<body>
    <header>
        <h1>My Flask App</h1>
    </header>

    <h1>Products</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% elif products %}
        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                    <tr>
                        <td>{{ product.name }}</td>
                        <td>{{ product.category }}</td>
                        <td>{{ product.price }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No products available.</p>
    {% endif %}

    <footer>
        <p>&copy; 2024 My Flask App</p>
    </footer>
</body>
</html>
